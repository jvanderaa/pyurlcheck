[tool.poetry]
name = "pyurlcheck"
version = "0.2.0"
description = "Search docs and validate URLs found are working properly."
authors = ["Jeff Kala <jeff.l.kala@gmail.com>"]
readme = "README.md"
license = "MIT"
homepage = "https://github.com/jeffkala/pyurlcheck.git"
repository = "https://github.com/jeffkala/pyurlcheck.git"
include = [
    "LICENSE",
]

[tool.poetry.scripts]
pyurlcheck = "pyurlcheck.cli:main"

[tool.poetry.dependencies]
python = "^3.10"
click = "^8.0"
requests = "^2.28"
dnspython = "^2.4"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0"
ruff = "^0.8"
invoke = "^2.0"
yamllint = "^1.28"
tomli = {version = "^2.0", python = "<3.11"}

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "D",       # pydocstyle
    "E", "F", "W",  # pyflakes + pycodestyle
    "S",       # bandit (security)
    "I",       # isort
]
ignore = [
    "D203",  # conflicts with D211
    "D212",  # conflicts with D213
    "D213",  # multi-line docstring summary at second line
    "D401",  # imperative mood
    "D407",  # dashed underline after section
    "D416",  # section name ends in colon
    "E501",  # line too long (formatter handles this)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "S"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
