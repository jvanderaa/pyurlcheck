---
name: "CI"

on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - "main"
      - "develop"
  pull_request: ~

jobs:
  lint:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v4"
      - name: "Set up Python"
        uses: "actions/setup-python@v4"
        with:
          python-version: "3.12"
      - name: "Install dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install --no-interaction
      - name: "Ruff format"
        run: "poetry run invoke ruff --action format --local"
      - name: "Ruff lint"
        run: "poetry run invoke ruff --action lint --local"
      - name: "Yamllint"
        run: "poetry run invoke yamllint --local"

  test:
    runs-on: "ubuntu-latest"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: "actions/checkout@v4"
      - name: "Set up Python ${{ matrix.python-version }}"
        uses: "actions/setup-python@v4"
        with:
          python-version: "${{ matrix.python-version }}"
      - name: "Install dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install --no-interaction
      - name: "Run tests"
        run: "poetry run invoke pytest --local"
